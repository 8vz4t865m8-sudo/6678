name: build-diag-dylib

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 编译（arm64e + arm64）
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          echo "----- 编译 arm64e -----"
          xcrun -sdk iphoneos clang -target arm64e-apple-ios17.0 -isysroot "$SDK" \
            -dynamiclib -O2 -fobjc-arc -Wno-everything \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -install_name @executable_path/Frameworks/CoreSetDiag.dylib \
            -o CoreSetDiag.arm64e.dylib CoreSetDiag.m
          echo "----- 编译 arm64 -----"
          xcrun -sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$SDK" \
            -dynamiclib -O2 -fobjc-arc -Wno-everything \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -install_name @executable_path/Frameworks/CoreSetDiag.dylib \
            -o CoreSetDiag.arm64.dylib CoreSetDiag.m
          echo "----- 合并 fat -----"
          lipo -create -output CoreSetDiag.dylib CoreSetDiag.arm64e.dylib CoreSetDiag.arm64.dylib
          echo "===== 架构核对（必须有 arm64e，不然注入必崩）====="
          lipo -info CoreSetDiag.dylib
          lipo -info CoreSetDiag.dylib | grep -q "arm64e" || { echo "FATAL: 没有 arm64e 切片，禁止使用"; exit 1; }
          lipo -info CoreSetDiag.dylib | grep -q "arm64"  || { echo "FATAL: 没有 arm64 切片"; exit 1; }
          mkdir -p out && cp CoreSetDiag.dylib out/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: CoreSetDiag-dylib
          path: out/CoreSetDiag.dylib
