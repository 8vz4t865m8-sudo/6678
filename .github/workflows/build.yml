name: Build CoreSetFix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          echo "SDK = $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: 编译 arm64e + arm64
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          echo "源码行数: $(wc -l < CoreSetFix.m)"
          grep -q "CoreSetFix" CoreSetFix.m || { echo "源码文件不对"; exit 1; }

          build_arch () {
            ARCH="$1"
            echo "----- 编译 $ARCH -----"
            xcrun --sdk iphoneos clang \
              -arch "$ARCH" -target "${ARCH}-apple-ios17.0" \
              -isysroot "$SDK" \
              -O2 -fblocks -fno-objc-arc \
              -Wall -Wno-incompatible-pointer-types \
              -dynamiclib \
              -install_name @rpath/CoreSetFix.dylib \
              -o "build/CoreSetFix-$ARCH.dylib" \
              CoreSetFix.m \
              -Wl,-undefined,dynamic_lookup
            echo "  → $(lipo -info build/CoreSetFix-$ARCH.dylib)"
          }

          build_arch arm64e
          build_arch arm64

          echo "----- 合并 fat 包 -----"
          lipo -create \
            -output build/CoreSetFix.dylib \
            build/CoreSetFix-arm64e.dylib \
            build/CoreSetFix-arm64.dylib

          echo "===== 产物信息 ====="
          lipo -info build/CoreSetFix.dylib
          file build/CoreSetFix.dylib
          size=$(stat -f%z build/CoreSetFix.dylib)
          echo "文件大小: $size 字节"

          # 硬核对:必须有 arm64e 和 arm64 两个切片
          lipo -info build/CoreSetFix.dylib | grep -q "arm64e" || { echo "!! 缺少 arm64e 切片,停止"; exit 1; }
          lipo -info build/CoreSetFix.dylib | grep -q "arm64 "  || { echo "!! 缺少 arm64 切片,停止"; exit 1; }
          echo "双切片确认 ✔"

      - name: 打包上传
        run: |
          cd build
          zip -q CoreSetFix-dylib.zip CoreSetFix.dylib
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: CoreSetFix-dylib
          path: build/CoreSetFix-dylib.zip
