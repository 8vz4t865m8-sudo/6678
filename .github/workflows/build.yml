name: Build CoreSetHack dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 看看 Xcode 和 iOS SDK
        run: |
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: 编译 dylib
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SRC="CoreSetHack.m"
          COMMON="-dynamiclib -fobjc-arc -O2 -w -isysroot $SDK -framework Foundation"

          echo "== 编译 arm64e(这台 App 是 arm64e,必须有这个架构) =="
          if clang $COMMON -target arm64e-apple-ios15.0 -o out_arm64e.dylib "$SRC"; then
            echo "arm64e 编译成功"
          else
            echo "arm64e 编译失败,退回 arm64"
            rm -f out_arm64e.dylib
          fi

          echo "== 编译 arm64(备用,老设备/兼容) =="
          if clang $COMMON -target arm64-apple-ios15.0 -o out_arm64.dylib "$SRC"; then
            echo "arm64 编译成功"
          else
            echo "arm64 编译失败"
            rm -f out_arm64.dylib
          fi

          if [ -f out_arm64e.dylib ] && [ -f out_arm64.dylib ]; then
            lipo -create out_arm64e.dylib out_arm64.dylib -output CoreSetHack.dylib
          elif [ -f out_arm64e.dylib ]; then
            cp out_arm64e.dylib CoreSetHack.dylib
          elif [ -f out_arm64.dylib ]; then
            cp out_arm64.dylib CoreSetHack.dylib
          else
            echo "两个架构都没编出来,看上面的报错"
            exit 1
          fi

          rm -f out_arm64e.dylib out_arm64.dylib

          echo "== 签名(ad-hoc) =="
          codesign -f -s - CoreSetHack.dylib
          codesign -dv CoreSetHack.dylib 2>&1 || true
          lipo -info CoreSetHack.dylib
          ls -la CoreSetHack.dylib

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: CoreSetHack-dylib
          path: CoreSetHack.dylib
          if-no-files-found: error
          retention-days: 90
